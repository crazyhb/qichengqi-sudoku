    <script type="module">
// 拉丁方数独引擎：棋盘尺寸参数化（size），可选宫格（boxRows × boxCols）。
// 与线上 7×7 版本逻辑一致，只是把写死的 7 改成了参数。

function shuffle(list, rng = Math.random) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function cloneGrid(grid) {
  return grid.map((row) => row.slice());
}

function createEngine({ size, boxRows = 0, boxCols = 0, difficulties, attempts = 24 }) {
  const N = size;
  const hasBoxes = boxRows > 0 && boxCols > 0;
  if (hasBoxes && boxRows * boxCols !== N) {
    throw new Error(`${boxRows}×${boxCols} 宫拼不成 ${N}×${N} 棋盘`);
  }
  const boxesPerRow = hasBoxes ? N / boxCols : 0;
  const DIGITS = Array.from({ length: N }, (_, i) => i + 1);
  const UNITS = buildUnits();

  function boxOf(r, c) {
    return hasBoxes ? Math.floor(r / boxRows) * boxesPerRow + Math.floor(c / boxCols) : -1;
  }

  function buildUnits() {
    const units = [];
    for (let i = 0; i < N; i += 1) {
      units.push(DIGITS.map((_, j) => [i, j]));
      units.push(DIGITS.map((_, j) => [j, i]));
    }
    if (hasBoxes) {
      for (let b = 0; b < N; b += 1) {
        const r0 = Math.floor(b / boxesPerRow) * boxRows;
        const c0 = (b % boxesPerRow) * boxCols;
        const cells = [];
        for (let dr = 0; dr < boxRows; dr += 1) {
          for (let dc = 0; dc < boxCols; dc += 1) cells.push([r0 + dr, c0 + dc]);
        }
        units.push(cells);
      }
    }
    return units;
  }

  function isPeer(r1, c1, r2, c2) {
    if (r1 === r2 && c1 === c2) return false;
    return r1 === r2 || c1 === c2 || (hasBoxes && boxOf(r1, c1) === boxOf(r2, c2));
  }

  function emptyGrid() {
    return Array.from({ length: N }, () => Array(N).fill(0));
  }

  function emptyNotes() {
    return Array.from({ length: N }, () => Array.from({ length: N }, () => []));
  }

  function canPlace(grid, r, c, d) {
    for (let i = 0; i < N; i += 1) {
      if (grid[r][i] === d || grid[i][c] === d) return false;
    }
    if (!hasBoxes) return true;
    const r0 = r - (r % boxRows);
    const c0 = c - (c % boxCols);
    for (let dr = 0; dr < boxRows; dr += 1) {
      for (let dc = 0; dc < boxCols; dc += 1) {
        if (grid[r0 + dr][c0 + dc] === d) return false;
      }
    }
    return true;
  }

  // 无宫格：循环拉丁方 + 随机行列/数字置换，瞬间生成。
  function latinSquare(rng) {
    const rowPerm = shuffle([...Array(N).keys()], rng);
    const colPerm = shuffle([...Array(N).keys()], rng);
    const digitPerm = shuffle(DIGITS, rng);
    const grid = emptyGrid();
    for (let r = 0; r < N; r += 1) {
      for (let c = 0; c < N; c += 1) {
        grid[r][c] = digitPerm[(rowPerm[r] + colPerm[c]) % N];
      }
    }
    return grid;
  }

  // 有宫格：回溯填满。
  function backtrackSolution(rng) {
    const grid = emptyGrid();
    const fill = (idx) => {
      if (idx === N * N) return true;
      const r = (idx / N) | 0;
      const c = idx % N;
      for (const d of shuffle(DIGITS, rng)) {
        if (canPlace(grid, r, c, d)) {
          grid[r][c] = d;
          if (fill(idx + 1)) return true;
          grid[r][c] = 0;
        }
      }
      return false;
    };
    fill(0);
    return grid;
  }

  function generateSolution(rng = Math.random) {
    return hasBoxes ? backtrackSolution(rng) : latinSquare(rng);
  }

  function isValidSolution(grid) {
    if (!grid || grid.length !== N || grid.some((row) => !row || row.length !== N)) return false;
    return UNITS.every((unit) => {
      const seen = new Set(unit.map(([r, c]) => grid[r][c]));
      return seen.size === N && DIGITS.every((d) => seen.has(d));
    });
  }

  function countClues(grid) {
    return grid.reduce((sum, row) => sum + row.filter(Boolean).length, 0);
  }

  // 数解的个数（最多数到 limit）。会就地修改 grid，调用方请先复制。
  function countSolutions(grid, limit = 2) {
    const rowUsed = Array.from({ length: N }, () => new Uint8Array(N + 1));
    const colUsed = Array.from({ length: N }, () => new Uint8Array(N + 1));
    const boxUsed = Array.from({ length: N }, () => new Uint8Array(N + 1));
    const empties = [];
    const free = (r, c, d) => !rowUsed[r][d] && !colUsed[c][d] && !(hasBoxes && boxUsed[boxOf(r, c)][d]);
    const mark = (r, c, d, on) => {
      rowUsed[r][d] = on;
      colUsed[c][d] = on;
      if (hasBoxes) boxUsed[boxOf(r, c)][d] = on;
    };
    for (let r = 0; r < N; r += 1) {
      for (let c = 0; c < N; c += 1) {
        const d = grid[r][c];
        if (!d) {
          empties.push(r * N + c);
          continue;
        }
        if (!free(r, c, d)) return 0;
        mark(r, c, d, 1);
      }
    }
    let found = 0;
    function search() {
      if (found >= limit) return;
      let bestIdx = -1;
      let bestCands = null;
      for (const idx of empties) {
        const r = (idx / N) | 0;
        const c = idx % N;
        if (grid[r][c]) continue;
        const cands = DIGITS.filter((d) => free(r, c, d));
        if (!bestCands || cands.length < bestCands.length) {
          bestIdx = idx;
          bestCands = cands;
          if (cands.length <= 1) break;
        }
      }
      if (bestIdx === -1) {
        found += 1;
        return;
      }
      const r = (bestIdx / N) | 0;
      const c = bestIdx % N;
      for (const d of bestCands) {
        grid[r][c] = d;
        mark(r, c, d, 1);
        search();
        grid[r][c] = 0;
        mark(r, c, d, 0);
        if (found >= limit) return;
      }
    }
    search();
    return found;
  }

  function hasUniqueSolution(grid) {
    return countSolutions(cloneGrid(grid), 2) === 1;
  }

  // 随机顺序挖洞，每挖一格都确认仍是唯一解。
  function digHoles(solution, remove, rng) {
    const puzzle = cloneGrid(solution);
    let removed = 0;
    for (const idx of shuffle([...Array(N * N).keys()], rng)) {
      if (removed >= remove) break;
      const r = (idx / N) | 0;
      const c = idx % N;
      const keep = puzzle[r][c];
      puzzle[r][c] = 0;
      if (hasUniqueSolution(puzzle)) removed += 1;
      else puzzle[r][c] = keep;
    }
    return puzzle;
  }

  // 多试几次，取挖得最多的一盘，保证三档难度的线索数拉得开。
  function generatePuzzle(difficulty = 'easy', rng = Math.random) {
    const spec = difficulties[difficulty] || difficulties.easy;
    let best = null;
    for (let attempt = 0; attempt < attempts; attempt += 1) {
      const solution = generateSolution(rng);
      const puzzle = digHoles(solution, spec.remove, rng);
      const removed = N * N - countClues(puzzle);
      if (!best || removed > best.removed) best = { puzzle, solution, removed };
      if (removed >= spec.remove) break;
    }
    return { puzzle: best.puzzle, solution: best.solution, difficulty: spec.id, clues: countClues(best.puzzle) };
  }

  function candidatesAt(grid, r, c) {
    return grid[r][c] ? [] : DIGITS.filter((d) => canPlace(grid, r, c, d));
  }

  // 同一行/列/宫里重复出现的数字所在格。
  function conflictCells(grid) {
    const out = new Set();
    for (const unit of UNITS) {
      const where = new Map();
      for (const [r, c] of unit) {
        const d = grid[r][c];
        if (!d) continue;
        if (!where.has(d)) where.set(d, []);
        where.get(d).push(`${r},${c}`);
      }
      for (const cells of where.values()) {
        if (cells.length > 1) cells.forEach((key) => out.add(key));
      }
    }
    return out;
  }

  function digitCounts(grid) {
    const counts = Array(N + 1).fill(0);
    for (const row of grid) for (const d of row) if (d) counts[d] += 1;
    return counts;
  }

  function isCompleteAndCorrect(grid, solution) {
    return grid.every((row, r) => row.every((d, c) => d === solution[r][c]));
  }

  // 提示：先挑候选最少的空格；没有空格就纠正第一个填错的格。
  function findHintCell(grid, solution, puzzle) {
    const empties = [];
    const wrong = [];
    for (let r = 0; r < N; r += 1) {
      for (let c = 0; c < N; c += 1) {
        if (puzzle[r][c]) continue;
        if (grid[r][c]) {
          if (grid[r][c] !== solution[r][c]) wrong.push([r, c]);
        } else {
          empties.push([r, c, candidatesAt(grid, r, c).length]);
        }
      }
    }
    const pick = empties.sort((a, b) => a[2] - b[2])[0] || wrong[0];
    return pick ? { r: pick[0], c: pick[1], value: solution[pick[0]][pick[1]] } : null;
  }

  function wrongCells(grid, solution, puzzle) {
    const out = new Set();
    for (let r = 0; r < N; r += 1) {
      for (let c = 0; c < N; c += 1) {
        if (!puzzle[r][c] && grid[r][c] && grid[r][c] !== solution[r][c]) out.add(`${r},${c}`);
      }
    }
    return out;
  }

  return {
    N,
    boxRows,
    boxCols,
    hasBoxes,
    DIFFICULTIES: difficulties,
    boxOf,
    isPeer,
    cloneGrid,
    emptyNotes,
    generateSolution,
    isValidSolution,
    countClues,
    countSolutions,
    hasUniqueSolution,
    generatePuzzle,
    candidatesAt,
    conflictCells,
    digitCounts,
    isCompleteAndCorrect,
    findHintCell,
    wrongCells,
  };
}

// 只记"看过规则"这类开关的小存储。
function flagStore(key) {
  return {
    get() {
      try {
        return localStorage.getItem(key) === '1';
      } catch {
        return false;
      }
    },
    set() {
      try {
        localStorage.setItem(key, '1');
      } catch {
        // 隐私模式下 localStorage 不可用，忽略即可
      }
    },
  };
}

// 一盘棋的状态：填数、笔记、撤销、提示、检查、存档。
// 注意：select() 只改选中格，绝不落子；数字只经 inputDigit() 进入。
function createGameClass(engine, { storageKey }) {
  const {
    N,
    DIFFICULTIES,
    cloneGrid: copy,
    emptyNotes,
    generatePuzzle,
    isCompleteAndCorrect,
    conflictCells,
    findHintCell,
    wrongCells,
    isPeer,
  } = engine;

  function firstEmpty(puzzle) {
    for (let r = 0; r < N; r += 1) {
      for (let c = 0; c < N; c += 1) if (!puzzle[r][c]) return { r, c };
    }
    return { r: 0, c: 0 };
  }

  return class Game {
    constructor(data) {
      this.puzzle = data.puzzle;
      this.solution = data.solution;
      this.grid = data.grid;
      this.notes = data.notes;
      this.difficulty = data.difficulty;
      this.elapsed = data.elapsed ?? 0;
      this.mistakes = data.mistakes ?? 0;
      this.completed = !!data.completed;
      this.hints = data.hints ?? 0;
      this.undoStack = data.undoStack ?? [];
      this.noteMode = !!data.noteMode;
      this.selected = data.selected ?? null;
      this.hinted = new Set(data.hinted ?? []);
      this.checkedWrong = new Set();
    }

    static fromGenerated(gen) {
      return new Game({
        puzzle: gen.puzzle,
        solution: gen.solution,
        grid: copy(gen.puzzle),
        notes: emptyNotes(),
        difficulty: gen.difficulty,
        selected: firstEmpty(gen.puzzle),
      });
    }

    static create(difficulty = 'easy') {
      return Game.fromGenerated(generatePuzzle(difficulty));
    }

    static load() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return null;
        const data = JSON.parse(raw);
        const bad =
          !data?.puzzle || !data?.solution || !data?.grid || !data?.notes || data.puzzle.length !== N || data.grid.length !== N;
        return bad ? null : new Game(data);
      } catch {
        return null;
      }
    }

    save() {
      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify({
            puzzle: this.puzzle,
            solution: this.solution,
            grid: this.grid,
            notes: this.notes,
            difficulty: this.difficulty,
            elapsed: this.elapsed,
            mistakes: this.mistakes,
            completed: this.completed,
            hints: this.hints,
            undoStack: this.undoStack.slice(-80),
            noteMode: this.noteMode,
            selected: this.selected,
            hinted: [...this.hinted],
          }),
        );
      } catch {
        // 存不进去就算了，不影响玩
      }
    }

    difficultyLabel() {
      return (DIFFICULTIES[this.difficulty] ?? DIFFICULTIES.easy).label;
    }

    canEdit(r, c) {
      return this.puzzle[r][c] === 0 && !this.completed;
    }

    select(r, c) {
      this.selected = { r, c };
      this.checkedWrong = new Set();
    }

    toggleNoteMode() {
      this.noteMode = !this.noteMode;
    }

    pushUndo(entry) {
      this.undoStack.push(entry);
      if (this.undoStack.length > 80) this.undoStack.shift();
    }

    inputDigit(d) {
      if (this.completed || !this.selected) return { ok: false, reason: 'noselect' };
      const { r, c } = this.selected;
      if (!this.canEdit(r, c)) return { ok: false, reason: 'clue' };

      if (this.noteMode) {
        if (this.grid[r][c]) return { ok: false, reason: 'filled' };
        const prevNotes = this.notes[r][c].slice();
        const nextNotes = prevNotes.includes(d)
          ? prevNotes.filter((x) => x !== d)
          : [...prevNotes, d].sort((a, b) => a - b);
        this.pushUndo({ type: 'notes', r, c, prevNotes, nextNotes, prevValue: 0, nextValue: 0, mistakeDelta: 0 });
        this.notes[r][c] = nextNotes;
        return { ok: true, kind: 'note' };
      }

      const prevValue = this.grid[r][c];
      const prevNotes = this.notes[r][c].slice();
      // 再点一次同一个数字 = 擦掉
      if (prevValue === d) {
        this.grid[r][c] = 0;
        this.pushUndo({
          type: 'value',
          r,
          c,
          prevValue,
          nextValue: 0,
          prevNotes,
          nextNotes: prevNotes,
          mistakeDelta: 0,
          hinted: this.hinted.has(`${r},${c}`),
        });
        this.hinted.delete(`${r},${c}`);
        return { ok: true, kind: 'erase' };
      }

      const mistakeDelta = d === this.solution[r][c] ? 0 : 1;
      this.grid[r][c] = d;
      this.notes[r][c] = [];
      this.clearPeerNotes(r, c, d);
      this.hinted.delete(`${r},${c}`);
      this.mistakes += mistakeDelta;
      this.pushUndo({ type: 'value', r, c, prevValue, nextValue: d, prevNotes, nextNotes: [], mistakeDelta, hinted: false });
      const won = isCompleteAndCorrect(this.grid, this.solution);
      if (won) this.completed = true;
      return { ok: true, kind: 'value', wrong: mistakeDelta === 1, won, softLimit: this.mistakes >= 5 && mistakeDelta === 1 };
    }

    clearPeerNotes(r, c, d) {
      for (let i = 0; i < N; i += 1) {
        for (let j = 0; j < N; j += 1) {
          if (isPeer(r, c, i, j)) this.notes[i][j] = this.notes[i][j].filter((x) => x !== d);
        }
      }
    }

    erase() {
      if (this.completed || !this.selected) return { ok: false, reason: 'noselect' };
      const { r, c } = this.selected;
      if (!this.canEdit(r, c)) return { ok: false, reason: 'clue' };
      const prevValue = this.grid[r][c];
      const prevNotes = this.notes[r][c].slice();
      if (!prevValue && prevNotes.length === 0) return { ok: false, reason: 'empty' };
      this.grid[r][c] = 0;
      this.notes[r][c] = [];
      this.hinted.delete(`${r},${c}`);
      this.pushUndo({ type: 'erase', r, c, prevValue, nextValue: 0, prevNotes, nextNotes: [], mistakeDelta: 0, hinted: false });
      return { ok: true, kind: 'erase' };
    }

    undo() {
      if (this.completed) return { ok: false, reason: 'done' };
      const entry = this.undoStack.pop();
      if (!entry) return { ok: false, reason: 'empty' };
      const { r, c } = entry;
      this.grid[r][c] = entry.prevValue;
      this.notes[r][c] = entry.prevNotes.slice();
      this.mistakes = Math.max(0, this.mistakes - (entry.mistakeDelta || 0));
      if (entry.hinted) this.hinted.add(`${r},${c}`);
      else this.hinted.delete(`${r},${c}`);
      this.selected = { r, c };
      this.checkedWrong = new Set();
      return { ok: true };
    }

    hint() {
      if (this.completed) return { ok: false, reason: 'done' };
      const pick = findHintCell(this.grid, this.solution, this.puzzle);
      if (!pick) return { ok: false, reason: 'none' };
      const { r, c, value } = pick;
      const prevValue = this.grid[r][c];
      const prevNotes = this.notes[r][c].slice();
      this.grid[r][c] = value;
      this.notes[r][c] = [];
      this.clearPeerNotes(r, c, value);
      this.hinted.add(`${r},${c}`);
      this.hints += 1;
      this.selected = { r, c };
      this.pushUndo({ type: 'hint', r, c, prevValue, nextValue: value, prevNotes, nextNotes: [], mistakeDelta: 0, hinted: true });
      const won = isCompleteAndCorrect(this.grid, this.solution);
      if (won) this.completed = true;
      return { ok: true, won, r, c };
    }

    check() {
      const conflicts = conflictCells(this.grid);
      const wrong = wrongCells(this.grid, this.solution, this.puzzle);
      this.checkedWrong = wrong;
      if (this.completed || isCompleteAndCorrect(this.grid, this.solution)) {
        this.completed = true;
        return { status: 'win', conflicts, wrong };
      }
      if (wrong.size === 0 && conflicts.size === 0) return { status: 'ok', conflicts, wrong };
      return { status: 'issues', conflicts, wrong };
    }

    restart() {
      this.grid = copy(this.puzzle);
      this.notes = emptyNotes();
      this.elapsed = 0;
      this.mistakes = 0;
      this.completed = false;
      this.hints = 0;
      this.undoStack = [];
      this.hinted = new Set();
      this.checkedWrong = new Set();
      this.selected = firstEmpty(this.puzzle);
      this.noteMode = false;
    }

    view() {
      return {
        puzzle: this.puzzle,
        grid: this.grid,
        notes: this.notes,
        selected: this.selected,
        noteMode: this.noteMode,
        completed: this.completed,
        elapsed: this.elapsed,
        mistakes: this.mistakes,
        hints: this.hints,
        difficulty: this.difficulty,
        difficultyLabel: this.difficultyLabel(),
        conflicts: conflictCells(this.grid),
        checkedWrong: this.checkedWrong,
        hinted: this.hinted,
        wrong: wrongCells(this.grid, this.solution, this.puzzle),
        canUndo: this.undoStack.length > 0 && !this.completed,
      };
    }
  };
}

// 5×5 拉丁方：每行每列 1–5 各一次，没有宫格。
// 三档难度按 7×7 的比例折算（7×7 挖 16/24/32 格，共 49 格）。
const engine = createEngine({
  size: 5,
  difficulties: {
    easy: { id: 'easy', label: '简单', remove: 8 },
    medium: { id: 'medium', label: '中等', remove: 12 },
    hard: { id: 'hard', label: '困难', remove: 16 },
  },
});

const { N, DIFFICULTIES, digitCounts } = engine;
const Game = createGameClass(engine, { storageKey: 'tuantuan-55-sudoku-v1' });
const rulesSeen = flagStore('tuantuan-55-sudoku-rules-seen');

const boardEl = document.querySelector('#board');
const padEl = document.querySelector('#pad');
const hudDiff = document.querySelector('#hud-diff');
const hudTime = document.querySelector('#hud-time');
const hudLeft = document.querySelector('#hud-left');
const hudMistakes = document.querySelector('#hud-mistakes');
const statusEl = document.querySelector('#status');
const toastEl = document.querySelector('#toast');
const notesBtn = document.querySelector('#btn-notes');
const undoBtn = document.querySelector('#btn-undo');
const dlgRules = document.querySelector('#dlg-rules');
const dlgNew = document.querySelector('#dlg-new');
const dlgWin = document.querySelector('#dlg-win');

let game = null;
let ticker = null;
let toastTimer = null;

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function save() {
  game?.save();
}

function startTicker() {
  stopTicker();
  ticker = setInterval(() => {
    if (!game || game.completed) return;
    game.elapsed += 1;
    hudTime.textContent = formatTime(game.elapsed);
    if (game.elapsed % 5 === 0) save();
  }, 1000);
}

function stopTicker() {
  if (ticker) clearInterval(ticker);
  ticker = null;
}

function renderPad(view) {
  const counts = digitCounts(view.grid);
  padEl.innerHTML = '';
  for (let d = 1; d <= N; d += 1) {
    const left = N - counts[d];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.digit = String(d);
    btn.className = left <= 0 ? 'done' : '';
    btn.innerHTML = `${d}<small>${Math.max(0, left)}</small>`;
    btn.setAttribute('aria-label', `填入 ${d}`);
    padEl.appendChild(btn);
  }
  const erase = document.createElement('button');
  erase.type = 'button';
  erase.className = 'erase';
  erase.dataset.erase = '1';
  erase.innerHTML = '擦<small>⌫</small>';
  padEl.appendChild(erase);
}

function renderBoard(view) {
  const sel = view.selected;
  const selValue = sel ? view.grid[sel.r][sel.c] : 0;
  boardEl.innerHTML = '';
  for (let r = 0; r < N; r += 1) {
    for (let c = 0; c < N; c += 1) {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell';
      cell.role = 'gridcell';
      cell.dataset.r = String(r);
      cell.dataset.c = String(c);
      const value = view.grid[r][c];
      const isClue = view.puzzle[r][c] !== 0;
      const key = `${r},${c}`;
      if (isClue) cell.classList.add('clue');
      if (sel && sel.r === r && sel.c === c) cell.classList.add('selected');
      else if (sel && (sel.r === r || sel.c === c)) cell.classList.add('peer');
      if (selValue && value === selValue) cell.classList.add('same');
      if (view.conflicts.has(key)) cell.classList.add('conflict');
      if (view.checkedWrong.has(key)) cell.classList.add('checked-wrong');
      if (view.hinted.has(key)) cell.classList.add('hinted');
      if (view.completed) cell.classList.add('won');
      const kind = isClue ? '线索' : '空格';
      cell.setAttribute(
        'aria-label',
        value ? `第 ${r + 1} 行第 ${c + 1} 列，${kind} ${value}` : `第 ${r + 1} 行第 ${c + 1} 列，空`,
      );
      if (value) {
        cell.textContent = String(value);
      } else if (view.notes[r][c].length) {
        const notes = document.createElement('div');
        notes.className = 'notes';
        for (let d = 1; d <= N; d += 1) {
          const span = document.createElement('span');
          const on = view.notes[r][c].includes(d);
          span.className = on ? 'on' : '';
          span.textContent = on ? String(d) : '';
          notes.appendChild(span);
        }
        cell.appendChild(notes);
      }
      boardEl.appendChild(cell);
    }
  }
}

function render() {
  if (!game) return;
  const view = game.view();
  hudDiff.textContent = view.difficultyLabel;
  hudTime.textContent = formatTime(view.elapsed);
  const filled = view.grid.flat().filter(Boolean).length;
  const left = N * N - filled;
  hudLeft.textContent = `剩 ${left} 格`;
  hudMistakes.textContent = `失误 ${view.mistakes}`;
  notesBtn.setAttribute('aria-pressed', view.noteMode ? 'true' : 'false');
  notesBtn.textContent = view.noteMode ? '笔记中' : '笔记';
  undoBtn.disabled = !view.canUndo;
  renderBoard(view);
  renderPad(view);
  if (view.completed) {
    statusEl.textContent = '团团：这盘收工啦。';
    stopTicker();
  } else if (view.mistakes >= 5) {
    statusEl.textContent = `团团：失误 ${view.mistakes} 次了，用提示或撤销吧。`;
  } else if (view.noteMode) {
    statusEl.textContent = '团团：笔记开着，点数字标候选。';
  } else {
    statusEl.textContent = `团团：还剩 ${left} 格，点格子再点数字。`;
  }
}

function celebrate() {
  const confetti = document.createElement('div');
  confetti.className = 'confetti';
  const colors = ['#4f7cff', '#ffba50', '#5ee0b0', '#9fc0ff', '#fff'];
  for (let i = 0; i < 42; i += 1) {
    const piece = document.createElement('i');
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = `${Math.random() * 0.35}s`;
    piece.style.transform = `rotate(${Math.random() * 90}deg)`;
    confetti.appendChild(piece);
  }
  document.body.appendChild(confetti);
  setTimeout(() => confetti.remove(), 1800);

  const view = game.view();
  document.querySelector('#win-copy').textContent =
    view.mistakes === 0 ? '团团给你点赞：一次都没填错。' : '行和列都收齐了，团团鼓掌。';
  document.querySelector('#win-stats').innerHTML = `
    <div><dt>用时</dt><dd>${formatTime(view.elapsed)}</dd></div>
    <div><dt>失误</dt><dd>${view.mistakes}</dd></div>
    <div><dt>难度</dt><dd>${view.difficultyLabel}</dd></div>
  `;
  if (!dlgWin.open) dlgWin.showModal();
}

function afterMove(result) {
  render();
  save();
  if (result?.wrong) {
    boardEl.querySelector('.cell.selected')?.classList.add('shake');
    toast('团团：这一格不对');
    if (result.softLimit) statusEl.textContent = `团团：失误较多（${game.mistakes}），试试提示`;
  }
  if (result?.won) celebrate();
}

function newGame(difficulty) {
  game = Game.create(difficulty || 'easy');
  startTicker();
  render();
  save();
  toast(`团团开局：${game.difficultyLabel()}`);
}

function boot() {
  game = Game.load();
  if (!game) {
    newGame('easy');
    return;
  }
  startTicker();
  render();
}

// 点格子只选中，不落子、不判错。数字只从下面的键盘或物理键盘进来。
boardEl.addEventListener('click', (event) => {
  const cell = event.target.closest('.cell');
  if (!cell || !game) return;
  game.select(Number(cell.dataset.r), Number(cell.dataset.c));
  render();
  save();
});

padEl.addEventListener('click', (event) => {
  const btn = event.target.closest('button');
  if (!btn || !game) return;
  if (btn.dataset.erase) {
    afterMove(game.erase());
    return;
  }
  const result = game.inputDigit(Number(btn.dataset.digit));
  if (!result.ok && result.reason === 'noselect') toast('团团：先点一个格子');
  if (!result.ok && result.reason === 'clue') toast('团团：线索不能改');
  if (!result.ok && result.reason === 'filled') toast('团团：先擦掉数字再做笔记');
  afterMove(result);
});

document.querySelector('#btn-new').addEventListener('click', () => {
  newGame(game?.difficulty || 'easy');
});

document.querySelector('#btn-diff').addEventListener('click', () => dlgNew.showModal());

undoBtn.addEventListener('click', () => {
  const result = game.undo();
  if (!result.ok) toast(result.reason === 'empty' ? '团团：没有可撤销的步骤' : '团团：这盘已经完成了');
  afterMove(result);
});

document.querySelector('#btn-hint').addEventListener('click', () => {
  const result = game.hint();
  toast(result.ok ? '团团帮你填了一格' : '团团：没有能提示的空格');
  afterMove(result);
});

document.querySelector('#btn-check').addEventListener('click', () => {
  const result = game.check();
  render();
  save();
  if (result.status === 'win') celebrate();
  else if (result.status === 'ok') toast('团团：目前没发现问题');
  else toast(`团团标出 ${result.wrong.size || result.conflicts.size} 处问题`);
});

notesBtn.addEventListener('click', () => {
  game.toggleNoteMode();
  render();
  save();
});

document.querySelector('#btn-rules').addEventListener('click', () => dlgRules.showModal());

dlgNew.addEventListener('close', () => {
  const choice = dlgNew.returnValue;
  dlgNew.returnValue = '';
  if (!choice || choice === 'cancel') return;
  if (choice === 'restart') {
    game.restart();
    startTicker();
    render();
    save();
    toast('团团：本题重来');
    return;
  }
  if (DIFFICULTIES[choice]) newGame(choice);
});

document.querySelector('#btn-again').addEventListener('click', () => {
  dlgWin.close();
  newGame(game.difficulty);
});

document.querySelector('#btn-win-close').addEventListener('click', () => dlgWin.close());

dlgRules.addEventListener('close', () => rulesSeen.set());

document.addEventListener('keydown', (event) => {
  if (!game || dlgNew.open || dlgRules.open || dlgWin.open) return;
  const digit = Number(event.key);
  if (Number.isInteger(digit) && digit >= 1 && digit <= N) {
    afterMove(game.inputDigit(digit));
  } else if (event.key === 'Backspace' || event.key === 'Delete' || event.key === '0') {
    afterMove(game.erase());
  } else if (event.key === 'n' || event.key === 'N') {
    game.toggleNoteMode();
    render();
  } else if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z') {
    afterMove(game.undo());
  } else if (event.key.startsWith('Arrow') && game.selected) {
    event.preventDefault();
    let { r, c } = game.selected;
    if (event.key === 'ArrowUp') r = (r + N - 1) % N;
    if (event.key === 'ArrowDown') r = (r + 1) % N;
    if (event.key === 'ArrowLeft') c = (c + N - 1) % N;
    if (event.key === 'ArrowRight') c = (c + 1) % N;
    game.select(r, c);
    render();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
});

boot();
if (!rulesSeen.get()) {
  statusEl.textContent = '团团：每行每列 1–5 各一次，没有宫格。点我看规则。';
  rulesSeen.set();
}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="top">
        <div class="brand">
          <button class="mascot" id="btn-rules" type="button" aria-label="团团说规则">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <ellipse cx="32" cy="36" rx="24" ry="22" fill="#ffb57a" />
              <ellipse cx="32" cy="34" rx="20" ry="18" fill="#ffd2a8" />
              <circle cx="24" cy="33" r="3.2" fill="#3b2418" />
              <circle cx="40" cy="33" r="3.2" fill="#3b2418" />
              <circle cx="25.2" cy="31.8" r="1" fill="#fff" />
              <circle cx="41.2" cy="31.8" r="1" fill="#fff" />
              <path d="M28 41c2.2 2.4 5.8 2.4 8 0" fill="none" stroke="#e85d3a" stroke-width="2.2" stroke-linecap="round" />
              <ellipse cx="20" cy="40" rx="4" ry="2.4" fill="#ff8d6a" opacity=".7" />
              <ellipse cx="44" cy="40" rx="4" ry="2.4" fill="#ff8d6a" opacity=".7" />
            </svg>
          </button>
          <div class="titles">
            <p class="eyebrow">团团速玩</p>
            <h1>5×5 数独</h1>
          </div>
          <div class="clock" aria-live="polite">
            <small>用时</small>
            <strong id="hud-time">00:00</strong>
          </div>
        </div>
        <div class="hud">
          <span class="pill" id="hud-diff">简单</span>
          <span class="pill" id="hud-left">剩 8 格</span>
          <span class="pill" id="hud-mistakes">失误 0</span>
        </div>
      </header>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="团团 5 乘 5 数独棋盘"></div>
      </div>

      <div class="pad" id="pad" role="group" aria-label="数字键盘"></div>

      <nav class="toolbar" aria-label="游戏操作">
        <button type="button" id="btn-new" class="primary-action">新局</button>
        <button type="button" id="btn-undo">撤销</button>
        <button type="button" id="btn-hint">提示</button>
        <button type="button" id="btn-diff">难度</button>
        <button type="button" id="btn-notes" aria-pressed="false">笔记</button>
        <button type="button" id="btn-check">检查</button>
      </nav>

      <p class="status" id="status" aria-live="polite">团团：点格子，再点数字。</p>
    </div>

    <dialog class="sheet" id="dlg-rules">
      <form method="dialog" class="sheet-body">
        <div class="sheet-mascot" aria-hidden="true">团团</div>
        <h2>团团怎么玩</h2>
        <p>这是手机版 <strong>5×5 数独</strong>。5 是质数，没有宫格，专心看好行和列就行。</p>
        <ul>
          <li>每一行填入 <strong>1–5 各一次</strong></li>
          <li>每一列填入 <strong>1–5 各一次</strong></li>
          <li>深色数字是线索，团团不让改</li>
          <li>点空格只是选中它，再用下面的数字键填入</li>
          <li>「笔记」可以先标候选，不怕忘</li>
        </ul>
        <p class="small">
          更简单：<a href="https://crazyhb.github.io/tuantuan-2x2/">团团 2×2</a> ·
          更难：<a href="https://crazyhb.github.io/qichengqi-sudoku/">团团 7×7</a>
        </p>
        <button type="submit" class="primary" value="ok">团团知道了</button>
      </form>
    </dialog>

    <dialog class="sheet" id="dlg-new">
      <form method="dialog" class="sheet-body">
        <h2>换一盘</h2>
        <p class="muted">点「新局」立刻再来当前难度。想加快或放慢，选下面。</p>
        <div class="choice-row">
          <button type="submit" value="easy">简单</button>
          <button type="submit" value="medium">中等</button>
          <button type="submit" value="hard">困难</button>
        </div>
        <button type="submit" value="restart">重开本题</button>
        <button type="submit" class="ghost" value="cancel">取消</button>
      </form>
    </dialog>

    <dialog class="sheet" id="dlg-win">
      <div class="sheet-body">
        <div class="win-burst" aria-hidden="true"></div>
        <h2>团团鼓掌！</h2>
        <p id="win-copy">这盘 5×5 收工了。</p>
        <dl class="stats" id="win-stats"></dl>
        <div class="choice-row">
          <button type="button" class="primary" id="btn-again">再来一局</button>
          <button type="button" id="btn-win-close">看看棋盘</button>
        </div>
      </div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
